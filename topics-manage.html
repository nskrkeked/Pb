<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토픽 관리 — Engineering Archive</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="background-grid"></div>
<div class="scanline"></div>

<!-- NAV -->
<nav class="topnav">
  <a href="index.html" class="nav-back">← ENG_ARCHIVE</a>
  <div class="nav-breadcrumb">
    <span>ADMIN</span>
    <span class="nav-sep">/</span>
    <span class="nav-current">토픽 관리</span>
  </div>
</nav>

<!-- CONTENT -->
<main class="manage-container">
  <section class="manage-section">
    <div class="section-head">
      <h1>토픽 관리</h1>
      <p class="section-desc">새로운 토픽을 추가하거나 기존 토픽을 관리합니다.</p>
    </div>

    <!-- ADD FORM -->
    <div class="manage-form">
      <h2>새 토픽 추가</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>토픽 이름</label>
          <input type="text" id="topicName" placeholder="예: Advanced Semiconductors" />
        </div>
        <div class="form-group">
          <label>설명</label>
          <input type="text" id="topicDesc" placeholder="예: 최신 반도체 기술" />
        </div>
        <div class="form-group">
          <label>이모지 (선택)</label>
          <input type="text" id="topicIcon" placeholder="예: 🚀" maxlength="2" />
        </div>
        <button class="btn-submit" onclick="addTopic()">추가 →</button>
      </div>
    </div>

    <!-- TOPICS LIST -->
    <div class="manage-list">
      <h2>현재 토픽 목록</h2>
      <div id="topicsList"></div>
    </div>
  </section>
</main>

<style>
.manage-container {
  max-width: 900px;
  margin: 100px auto;
  padding: 60px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.manage-section h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

.manage-section .section-desc {
  color: var(--text-dim);
  margin-bottom: 40px;
}

.manage-form {
  margin-bottom: 60px;
  padding: 30px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.manage-form h2 {
  font-size: 1.3rem;
  margin-bottom: 20px;
  color: var(--accent);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1.5fr 1fr auto;
  gap: 12px;
  align-items: flex-end;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {
  font-size: 0.85rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  font-weight: 600;
}

.form-group input {
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border-bright);
  color: var(--text);
  border-radius: 4px;
  font-family: var(--sans);
  transition: 0.2s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(232, 255, 71, 0.1);
}

.btn-submit {
  padding: 12px 24px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 4px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}

.btn-submit:hover {
  transform: translate(-2px, -2px);
  box-shadow: 2px 2px 0 var(--accent2);
}

.manage-list {
  padding: 30px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.manage-list h2 {
  font-size: 1.3rem;
  margin-bottom: 20px;
  color: var(--accent);
}

.topic-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 12px;
  transition: 0.2s;
}

.topic-item:hover {
  border-color: var(--accent);
}

.topic-item-info {
  flex: 1;
}

.topic-item-name {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}

.topic-item-desc {
  font-size: 0.9rem;
  color: var(--text-dim);
  margin-top: 4px;
}

.topic-item-badge {
  font-size: 0.75rem;
  color: var(--text-muted);
  background: var(--border);
  padding: 4px 8px;
  border-radius: 3px;
  margin-left: 8px;
}

.topic-item-actions {
  display: flex;
  gap: 8px;
}

.btn-delete-sm {
  padding: 8px 12px;
  background: transparent;
  border: 1px solid var(--border-bright);
  color: #ff5f57;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: 0.2s;
}

.btn-delete-sm:hover {
  border-color: #ff5f57;
  background: rgba(255, 95, 87, 0.1);
}

.empty-message {
  text-align: center;
  padding: 40px;
  color: var(--text-dim);
}

@media (max-width: 768px) {
  .manage-container {
    padding: 30px;
    margin: 80px 20px;
  }
  
  .form-grid {
    grid-template-columns: 1fr;
  }
}
</style>

<script>
const DEFAULT_TOPICS = [
  { name: 'Semiconductors', desc: '반도체 구조, 역할, 발전 과정', icon: '💾' },
  { name: 'Circuits',       desc: '회로의 원리와 응용',           icon: '⚡' },
  { name: 'AI Hardware',    desc: 'AI 시대의 연산 구조',          icon: '🤖' },
  { name: 'Materials',      desc: '신소재와 공학 기술',           icon: '🔬' },
];

function allTopics() {
  const custom = JSON.parse(localStorage.getItem('eng_custom_topics') || '[]');
  return [...DEFAULT_TOPICS, ...custom];
}

function renderTopicsList() {
  const topics = allTopics();
  const container = document.getElementById('topicsList');
  container.innerHTML = '';
  
  if (topics.length === 0) {
    container.innerHTML = '<div class="empty-message">토픽이 없습니다.</div>';
    return;
  }

  topics.forEach((topic, idx) => {
    const isDefault = idx < DEFAULT_TOPICS.length;
    const el = document.createElement('div');
    el.className = 'topic-item';
    el.innerHTML = `
      <div class="topic-item-info">
        <div class="topic-item-name">
          <span>${topic.icon || '📁'}</span>
          <span>${topic.name}</span>
          ${isDefault ? '<span class="topic-item-badge">기본</span>' : ''}
        </div>
        <div class="topic-item-desc">${topic.desc}</div>
      </div>
      <div class="topic-item-actions">
        ${!isDefault ? `<button class="btn-delete-sm" onclick="deleteTopic(${idx})">삭제</button>` : '<span></span>'}
      </div>
    `;
    container.appendChild(el);
  });
}

function addTopic() {
  const name = document.getElementById('topicName').value.trim();
  const desc = document.getElementById('topicDesc').value.trim();
  const icon = document.getElementById('topicIcon').value.trim() || '📁';

  if (!name || !desc) {
    alert('토픽 이름과 설명을 입력해주세요.');
    return;
  }

  // 중복 체크
  if (allTopics().some(t => t.name === name)) {
    alert('이미 존재하는 토픽입니다.');
    return;
  }

  const custom = JSON.parse(localStorage.getItem('eng_custom_topics') || '[]');
  custom.push({ name, desc, icon });
  localStorage.setItem('eng_custom_topics', JSON.stringify(custom));

  document.getElementById('topicName').value = '';
  document.getElementById('topicDesc').value = '';
  document.getElementById('topicIcon').value = '';

  renderTopicsList();
}

function deleteTopic(idx) {
  const topic = allTopics()[idx];
  if (confirm(`"${topic.name}" 토픽을 삭제하시겠습니까?`)) {
    const custom = JSON.parse(localStorage.getItem('eng_custom_topics') || '[]');
    const customIdx = idx - DEFAULT_TOPICS.length;
    if (customIdx >= 0 && customIdx < custom.length) {
      custom.splice(customIdx, 1);
      localStorage.setItem('eng_custom_topics', JSON.stringify(custom));
      renderTopicsList();
    }
  }
}

// INIT
renderTopicsList();
</script>

</body>
</html>
